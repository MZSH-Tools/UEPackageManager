[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-package-manager"
version = "2.1.0"
description = "通用 Unreal Engine 项目打包与附加文件部署工具"
requires-python = ">=3.11,<3.13"
dependencies = [
    "platformdirs==4.4.0",
    "PySide6==6.11.2",
]

[project.optional-dependencies]
build = ["PyInstaller==6.18.0"]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["Source*"]
